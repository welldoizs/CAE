name: Build CAE Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - app/capacitor-bootstrap
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build unsigned test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html script.js style.css www/
          test -s www/index.html
          test -s www/script.js
          test -s www/style.css
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: cae-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
